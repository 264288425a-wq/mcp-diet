[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-diet"
version = "0.1.0"
description = "Put your MCP servers on a diet: context token budget analyzer, CI PR diff gate, and runtime response-slimming proxy."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "mcp-diet contributors" },
]
keywords = [
  "mcp",
  "model-context-protocol",
  "llm",
  "ai-agents",
  "tokens",
  "context-budget",
  "devtools",
  "cli",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
tiktoken = ["tiktoken>=0.7.0"]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "build>=1.2.0",
  "twine>=5.1.0",
]

[project.scripts]
mcp-diet = "mcp_diet.cli:main"

[project.urls]
Homepage = "https://github.com/264288425a-wq/mcp-diet"
Repository = "https://github.com/264288425a-wq/mcp-diet"
Issues = "https://github.com/264288425a-wq/mcp-diet/issues"
Changelog = "https://github.com/264288425a-wq/mcp-diet/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcp_diet = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
