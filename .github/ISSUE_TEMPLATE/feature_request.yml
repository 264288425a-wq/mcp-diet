name: Feature Request
description: Propose a new lint rule, protocol feature, or reporter format.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What MCP context bloat or workflow problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the CLI flag, rule ID, or Python API you envision.
    validations:
      required: true
